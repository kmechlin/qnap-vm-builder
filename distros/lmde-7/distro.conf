# Sourced by build.sh when --distro lmde-7. LMDE 7 ("Gigi") is Debian 13
# trixie + Mint packages — there's no official LMDE qcow2, so we reuse the
# Debian genericcloud base and have cloud-init install Cinnamon from
# Debian's own repos. Same base means cache/ entry is shared with debian-13.
DISTRO_DESCRIPTION="Linux Mint Debian Edition 7 (Debian 13 base + Cinnamon)"
BASE_URL="https://cloud.debian.org/images/cloud/trixie/latest"
BASE_IMG="debian-13-genericcloud-amd64.qcow2"
SHA_FILE="SHA512SUMS"
SHA_TOOL="sha512sum"
OVF_OS_TYPE="debian13"
